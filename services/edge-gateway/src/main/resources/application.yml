server:
  port: 8080

spring:
  application:
    name: edge-gateway
  cloud:
    gateway:
      # Default is true; left at default. The audit-trace exploit (the env-flip
      # SpEL payload) uses indexer syntax against @systemProperties, which the
      # restrictive PropertyAccessor does not gate — so this flag does not need
      # to be flipped first. See docs/notes.md for the full breakdown.
      restrictive-property-accessor:
        enabled: true
      routes:
        - id: archive
          uri: ${ARCHIVE_URI:http://archive-service:8081}
          predicates:
            - Path=/users/**,/notes/**,/documents/**

# CTF-only misconfiguration: actuator is exposed and unauthenticated, and the
# gateway / env endpoints are at access=unrestricted (which lets POST/DELETE
# through on /actuator/gateway/routes/{id} — the CVE-2025-41243 surface).
# In Spring Boot 3.4 each endpoint's `access` defaults are conservative for
# Spring Cloud Gateway, so the override is load-bearing.
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,refresh,env,mappings
  endpoint:
    gateway:
      access: unrestricted
    env:
      access: unrestricted

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
