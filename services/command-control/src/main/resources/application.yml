server:
  port: 8082

spring:
  application:
    name: command-control

auth:
  jwt-secret: ${JWT_SECRET:ctf-shared-jwt-secret-do-not-use-in-prod-please}
  jwt-ttl-seconds: ${JWT_TTL_SECONDS:30}
  otp-seed: ${OTP_SEED:presidential-otp-seed-2026}
  otp-window-seconds: ${OTP_WINDOW_SECONDS:30}
  president-password: ${PRESIDENT_PASSWORD:Th3.Pr3sident's_Password!2026}

flags:
  flag4: ${FLAG_4:FLAG{flag4-not-set}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    org.mato.command: INFO
