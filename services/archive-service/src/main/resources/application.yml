server:
  port: 8080

spring:
  application:
    name: archive-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/orgarchive}
    username: ${SPRING_DATASOURCE_USERNAME:orgarchive}
    password: ${SPRING_DATASOURCE_PASSWORD:orgarchive}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        show_sql: false

seed:
  weak-password: ${WEAK_USER_PASSWORD:sunshine}
  final-flag: ${FINAL_FLAG:FLAG{archive-isolation-broken-by-converter}}

logging:
  level:
    root: INFO
