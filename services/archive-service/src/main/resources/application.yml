server:
  port: 8081

spring:
  application:
    name: archive-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/sctp}
    username: ${SPRING_DATASOURCE_USERNAME:sctp}
    password: ${SPRING_DATASOURCE_PASSWORD:sctp}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        show_sql: false

ldap:
  url: ${LDAP_URL:ldap://localhost:389}
  base: ${LDAP_BASE:dc=mato,dc=int}

seed:
  weak-password: ${WEAK_USER_PASSWORD:sunshine}
  final-flag: ${FINAL_FLAG:FLAG{archive-isolation-broken-by-converter}}

logging:
  level:
    root: INFO
